<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alimentazione · anteprima</title>
<style>
  :root { --bg:#0d0f14; --bg2:#151821; --card:#1b1f2a; --card2:#232837; --line:#2c3243; --text:#f4f6fb; --muted:#9aa3b8;
    --cibo:#2ee59d; --cibo2:#c6f432; --fisico:#ff6a3d; --apnea:#22c3ee; --warn:#ffb23d; --r:18px; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  #app { max-width: 560px; margin: 0 auto; padding: 12px 16px 0; }
</style>
<link rel="stylesheet" href="ali.css">
</head>
<body>
<div id="app"><div id="ali-root"></div></div>
<script src="ali-dati.js"></script>
<script src="ali.js"></script>
<script>
  // Anteprima autonoma: nell'app vera il router lo fa da solo.
  function vai() {
    var h = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (h[0] !== 'alimentazione') { location.hash = '#/alimentazione'; return; }
    window.Mr9Alimentazione.mount(document.getElementById('ali-root'), { percorso: h.slice(1) });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', vai); vai();
</script>
</body>
</html>
